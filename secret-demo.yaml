apiVersion: apps/v1
kind: Deployment

metadata:
  name: secret-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: secret-demo

  template:
    metadata:
      labels:
        app: secret-demo

    spec:
      containers:
      - name: secret-demo
        image: nginx

        envFrom:
        - secretRef:
            name: app-secret
