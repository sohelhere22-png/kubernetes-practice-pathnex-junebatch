# stress-test pod — jaan bujhkar limit todega
apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
spec:
  containers:
  - name: stress
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "300M"]  # 300M maangega, limit 200M hai
    # Result: OOMKilled!
